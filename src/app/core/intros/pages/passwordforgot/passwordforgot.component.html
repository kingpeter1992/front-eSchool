<div class="auth-wrapper">
  <div class="auth-card">

    <!-- En-tête de la carte -->
    <div class="auth-header">
      <div class="logo-wrapper">
        <img
          id="profile-img"
          src="assets/logo.png"
          alt="Eschool Logo"
          class="auth-logo"
        />
      </div>
      <span class="system-badge">E-School ERP</span>
      <h2 class="auth-title">Mot de passe oublié</h2>
      <p class="auth-subtitle">Entrez votre e-mail pour recevoir les instructions de réinitialisation.</p>
    </div>

    <!-- Spinner de chargement -->
    <div *ngIf="loading$ | async" class="spinner-overlay">
      <div class="custom-spinner"></div>
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="input-group">
        <label for="email-input" class="visually-hidden">Votre email</label>
        <i class="pi pi-envelope input-icon"></i>
        <input
          id="email-input"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Votre adresse email"
          class="custom-input"
          required
        />
      </div>

      <button class="btn-submit" type="submit">
        <span>Envoyer</span>
        <i class="pi pi-send"></i>
      </button>
    </form>

    <!-- Pied de carte avec lien de retour -->
    <div class="auth-footer">
      <a routerLink="/login" class="back-link">
        <i class="pi pi-arrow-left"></i>
        <span>Retour à la connexion</span>
      </a>
    </div>

  </div>
</div>
