<div class="auth-wrapper">
  <!-- Carte Principale -->
  <div class="auth-card">

    <!-- En-tête avec Logo & Badge -->
    <div class="auth-header">
      <div class="logo-wrapper">
        <img id="profile-img" src="assets/logo.png" alt="E-School Logo" class="auth-logo" />
      </div>
      <span class="system-badge">E-School ERP</span>
      <h2 class="auth-title">Nouveau mot de passe</h2>
      <p class="auth-subtitle">Veuillez définir votre nouveau mot de passe de connexion.</p>
    </div>

    <!-- Spinner de Chargement -->
    @if (loading$ | async) {
      <div class="spinner-overlay">
        <div class="custom-spinner"></div>
      </div>
    }

    <!-- Formulaire -->
    <form (ngSubmit)="onSubmit()" class="auth-form">

      <!-- Champ Nouveau mot de passe -->
      <div class="input-group">
        <label for="password-input" class="visually-hidden">Nouveau mot de passe</label>
        <i class="pi pi-lock input-icon"></i>
        <input
          id="password-input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Nouveau mot de passe"
          class="custom-input"
          required
        />
        <i
          [class]="showPassword ? 'pi pi-eye-slash toggle-password' : 'pi pi-eye toggle-password'"
          (click)="showPassword = !showPassword">
        </i>
      </div>

      <!-- Champ Confirmation (Optionnel mais recommandé pour la sécurité) -->
      <div class="input-group">
        <label for="confirm-password-input" class="visually-hidden">Confirmer le mot de passe</label>
        <i class="pi pi-shield input-icon"></i>
        <input
          id="confirm-password-input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirmer le mot de passe"
          class="custom-input"
          required
        />
      </div>

      <button class="btn-submit" type="submit">
        <span>Réinitialiser</span>
        <i class="pi pi-check-circle"></i>
      </button>
    </form>

    <!-- Pied de Carte -->
    <div class="auth-footer">
      <a routerLink="/login" class="back-link">
        <i class="pi pi-arrow-left"></i>
        <span>Retour à la connexion</span>
      </a>
    </div>

  </div>
</div>
